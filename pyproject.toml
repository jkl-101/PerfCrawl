[project]
name = "perfcrawl"
version = "0.1.0"
description = "General-purpose website performance auditing tool: crawl, measure, analyze, report."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.60,<2",
    "pydantic>=2.10,<3",
    "w3lib>=2.3,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.15,<0.16",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "e2e: end-to-end test requiring Node + Chrome + network (opt-in; skipped by default in CI)",
]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
