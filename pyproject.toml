[project]
name = "perfcrawl"
version = "0.1.0"
description = "General-purpose website performance auditing tool: crawl, measure, analyze, report."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.60,<2",
    "pydantic>=2.10,<3",
    "rich>=13",
    "typer>=0.15",
    "w3lib>=2.3,<3",
]

# WR-10: ``[project.scripts]`` deliberately omitted. PerfCrawl ships a
# repo-checkout-only workflow today — the Node ``lighthouse-worker/`` lives as
# a sibling of ``src/`` and is NOT bundled into the wheel, so a
# ``pip install perfcrawl`` produced binary would point at a path that does
# not exist. Run from a checkout via ``uv run python -m perfcrawl.cli`` (or
# equivalent) until Phase 3 makes the worker location configurable
# (PERFCRAWL_WORKER_DIR env / CLI flag).

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.15,<0.16",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -m 'not e2e'"
markers = [
    "e2e: end-to-end test requiring Node + Chrome + network (opt-in; skipped by default in CI)",
]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
