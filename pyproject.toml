[project]
name = "perfcrawl"
version = "0.1.0"
description = "General-purpose website performance auditing tool: crawl, measure, analyze, report."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.107,<0.108",
    "httpx>=0.27,<1",
    "openai>=2.41,<3",
    "playwright>=1.60,<2",
    "protego>=0.4,<1",
    "pydantic>=2.10,<3",
    "rich>=13",
    "typer>=0.15",
    "w3lib>=2.3,<3",
]

# WR-10: ``[project.scripts]`` works correctly under ``uv run`` (editable
# install — the working-tree ``lighthouse-worker/`` sibling resolves via
# ``WORKER_SCRIPT = Path(__file__).resolve().parents[2] / ...``). It is NOT
# expected to work after a ``pip install perfcrawl`` because the Node worker
# is not bundled into the wheel; the wheel-install failure mode is documented
# in README § Install and surfaced as an actionable ``MeasurementError`` by
# ``lighthouse_worker.preflight()`` ("lighthouse-worker directory not found").
# Phase 3 will make the worker location configurable
# (``PERFCRAWL_WORKER_DIR`` env / CLI flag) to lift this restriction.
[project.scripts]
perfcrawl = "perfcrawl.cli:app"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.15,<0.16",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -m 'not e2e and not llm'"
markers = [
    "e2e: end-to-end test requiring Node + Chrome + network (opt-in; skipped by default in CI)",
    "llm: advisory LLM-judge eval requiring ANTHROPIC_API_KEY + network (opt-in; run via -m llm)",
]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Typer's argument-default idiom is ``param: T = typer.Option(...)`` /
# ``typer.Argument(...)`` — a deliberate call-in-default that B008 would
# otherwise flag. These calls are effectively immutable sentinels (Typer reads
# them at decoration time), so allowlist them the way the Typer docs recommend.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
